[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-bpe"
version = "1.0.0"
description = "BPE tokenisation benchmark for EEG signals across six datasets and five paradigm types"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Albert Nasybullin", email = "a.nasibullin@innopolis.university"},
    {name = "Alexey Kornaev", email = "a.kornaev@innopolis.ru"},
]
keywords = ["EEG", "BPE", "tokenisation", "brain-computer interface", "signal processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "mne>=1.5",
    "moabb>=0.5",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "tqdm>=4.65",
    "pandas>=2.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1",
]
datasets = [
    "mne>=1.6",
    "moabb>=1.1",
    "pooch>=1.8",
    "requests>=2.31",
    "wfdb>=4.1",
]
viz = [
    "umap-learn>=0.5",
]
all = [
    "eeg-bpe[gpu,datasets,viz]",
]

[project.urls]
Repository = "https://github.com/levshaazz/eeg-bpe-benchmark"

[tool.setuptools.packages.find]
include = ["eeg_bpe*"]
